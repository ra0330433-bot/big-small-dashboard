<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Big-Small Dashboard (Prototype)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      body { padding: 20px; }
      .card { margin-top: 10px }
      .totals { font-size: 1.3rem; font-weight: 600 }
      #chartContainer { height: 320px }
    </style>
  </head>
  <body>
    <div class="container">
      <h3>Big / Small — Dashboard Prototype</h3>
      <p class="text-muted">Upload a CSV of bets (period,timestamp,side,number,amount). Sample CSV included.</p>

      <div class="row">
        <div class="col-md-6">
          <div class="card p-3">
            <label class="form-label">Upload CSV</label>
            <input id="csvInput" type="file" accept=".csv" class="form-control" />
            <div class="mt-2">
              <button id="loadSample" class="btn btn-sm btn-primary">Load sample data</button>
              <button id="exportBtn" class="btn btn-sm btn-outline-secondary">Export summary CSV</button>
            </div>
          </div>

          <div class="card p-3">
            <div>Totals</div>
            <div class="d-flex justify-content-between mt-2">
              <div>Big: <span id="bigTotal" class="totals">0</span></div>
              <div>Small: <span id="smallTotal" class="totals">0</span></div>
            </div>
            <hr />
            <div>Per number totals (0-9)</div>
            <table class="table table-sm mt-2" id="numTable">
              <thead><tr><th>Number</th><th>Total</th></tr></thead>
              <tbody></tbody>
            </table>
          </div>
        </div>

        <div class="col-md-6">
          <div class="card p-3">
            <div id="chartContainer">
              <canvas id="mainChart"></canvas>
            </div>
          </div>

          <div class="card p-3">
            <div>Recent bets (last 50)</div>
            <div style="max-height:200px; overflow:auto;">
              <table class="table table-sm mt-2"><thead><tr><th>Period</th><th>Side</th><th>Num</th><th>Amt</th></tr></thead><tbody id="recentBody"></tbody></table>
            </div>
          </div>
        </div>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="app.js"></script>
  </body>
</html>
